<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LHX Keysystem</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, #25253d 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #301722 0%, transparent 35%),
                #08080d;

            color: white;
        }

        .background-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.18;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }

        .glow-one {
            background: #ffffff;
            top: -250px;
            left: -200px;
        }

        .glow-two {
            background: #ff0000;
            bottom: -300px;
            right: -200px;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(60px, 40px);
            }
        }

        /* MAIN CARD */

        .container {
            width: 90%;
            max-width: 520px;
            padding: 38px;

            position: relative;
            z-index: 2;

            background: rgba(18, 18, 25, 0.88);
            backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            animation: cardAppear 0.7s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* LOGO */

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 76px;
            height: 76px;
            margin: 0 auto 22px;

            border-radius: 24px;
            background: linear-gradient(135deg, #ffffff, #8f8f8f);

            color: black;
            font-size: 25px;
            font-weight: 900;

            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.15);

            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }

            50% {
                transform: translateY(-7px) rotate(2deg);
            }
        }

        h1 {
            text-align: center;
            font-size: 36px;
            letter-spacing: -1px;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #8f8f8f,
                #ffffff
            );

            background-size: 200%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: titleGlow 4s linear infinite;
        }

        @keyframes titleGlow {
            from {
                background-position: 0%;
            }

            to {
                background-position: 200%;
            }
        }

        .subtitle {
            text-align: center;
            color: #9a9a9a;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .tasks {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* BUTTON BASE */

        .task-button {
            width: 100%;
            min-height: 64px;
            padding: 17px 22px;

            position: relative;
            overflow: hidden;

            border: none;
            border-radius: 18px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;

            font-size: 16px;
            font-weight: 800;

            transition:
                transform 0.25s cubic-bezier(.2,.8,.2,1),
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .task-button::before {
            content: "";

            position: absolute;
            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.45),
                transparent
            );

            transform: skewX(-25deg);
            transition: left 0.6s ease;
        }

        .task-button:hover::before {
            left: 150%;
        }

        .task-button:hover {
            transform: translateY(-5px) scale(1.02);
        }

        .task-button:active {
            transform: translateY(0) scale(0.97);
        }

        /* TIKTOK */

        .tiktok-button {
            color: #000;

            background: linear-gradient(
                135deg,
                #ffffff,
                #e9e9e9,
                #ffffff
            );

            box-shadow:
                0 10px 0 #bdbdbd,
                0 18px 40px rgba(255,255,255,0.08);
        }

        .tiktok-icon {
            width: 25px;
            height: 25px;
            fill: #000;
        }

        /* YOUTUBE */

        .youtube-button {
            color: white;

            background: linear-gradient(
                135deg,
                #ff2828,
                #e00000 50%,
                #b90000
            );

            box-shadow:
                0 10px 0 #870000,
                0 18px 40px rgba(255,0,0,0.2);
        }

        .youtube-icon {
            width: 28px;
            height: 28px;
            fill: white;
        }

        /* CHECKING */

        .checking {
            pointer-events: none;
            cursor: wait;
            animation: checkingPulse 1.2s ease-in-out infinite;
        }

        .checking.tiktok-button {
            background: linear-gradient(
                135deg,
                #d8d8d8,
                #ffffff,
                #d8d8d8
            );
        }

        .checking.youtube-button {
            background: linear-gradient(
                135deg,
                #ff5555,
                #ff0000,
                #b90000
            );
        }

        @keyframes checkingPulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }

            50% {
                transform: scale(1.015);
                filter: brightness(1.15);
            }
        }

        .loading-spinner {
            width: 22px;
            height: 22px;

            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: white;

            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .tiktok-spinner {
            border-color: rgba(0, 0, 0, 0.2);
            border-top-color: #000;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* COMPLETED */

        .completed {
            color: white;

            background: linear-gradient(
                135deg,
                #20df7a,
                #0aa552
            ) !important;

            box-shadow:
                0 10px 0 #08763d,
                0 18px 45px rgba(24, 201, 110, 0.25);

            pointer-events: none;

            animation: completedPop 0.5s ease;
        }

        @keyframes completedPop {
            0% {
                transform: scale(0.92);
            }

            70% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }

        .check-icon {
            font-size: 22px;
            font-weight: bold;
            animation: checkPop 0.5s ease;
        }

        @keyframes checkPop {
            0% {
                transform: scale(0) rotate(-90deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        /* =========================
           UNLOCK PROGRESS
        ========================= */

        .progress-section {
            margin-top: 30px;
            padding: 22px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid rgba(255,255,255,0.1);

            position: relative;
            overflow: hidden;
        }

        .progress-section::before {
            content: "";

            position: absolute;
            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: rgba(255,255,255,0.08);

            filter: blur(60px);

            top: -100px;
            right: -60px;

            animation: progressGlow 4s ease-in-out infinite;
        }

        @keyframes progressGlow {
            0%, 100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.8;
            }
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;

            position: relative;
            z-index: 2;
        }

        .progress-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .progress-percent {
            font-size: 14px;
            font-weight: 900;

            color: white;

            padding: 6px 10px;

            border-radius: 10px;

            background: rgba(255,255,255,0.08);

            transition: 0.4s ease;
        }

        .progress-bar {
            width: 100%;
            height: 14px;

            border-radius: 20px;

            overflow: hidden;

            background: rgba(0,0,0,0.35);

            box-shadow:
                inset 0 2px 8px rgba(0,0,0,0.4);

            position: relative;
            z-index: 2;
        }

        .progress-fill {
            width: 0%;
            height: 100%;

            border-radius: 20px;

            position: relative;

            background:
                linear-gradient(
                    90deg,
                    #7a7a7a,
                    #ffffff,
                    #7a7a7a
                );

            background-size: 200% 100%;

            transition:
                width 1s cubic-bezier(.2,.8,.2,1);

            animation: progressShine 2s linear infinite;

            box-shadow:
                0 0 15px rgba(255,255,255,0.5),
                0 0 30px rgba(255,255,255,0.15);
        }

        @keyframes progressShine {
            from {
                background-position: 0%;
            }

            to {
                background-position: 200%;
            }
        }

        .progress-fill::after {
            content: "";

            position: absolute;

            top: 0;
            right: 0;

            width: 30px;
            height: 100%;

            background: white;

            filter: blur(10px);

            opacity: 0.7;
        }

        .progress-status {
            margin-top: 14px;

            text-align: center;

            color: #888;

            font-size: 12px;

            position: relative;
            z-index: 2;

            transition: 0.4s ease;
        }

        .progress-section.unlocked {
            animation: unlockedGlow 1s ease;
        }

        @keyframes unlockedGlow {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.025);
                box-shadow:
                    0 0 40px rgba(24, 201, 110, 0.2);
            }
        }

        /* FOOTER */

        .footer {
            margin-top: 24px;
            padding-top: 18px;

            border-top: 1px solid rgba(255,255,255,0.07);

            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .footer span {
            color: white;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }

            .logo {
                width: 68px;
                height: 68px;
                font-size: 22px;
            }

            .task-button {
                min-height: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="container">

        <div class="logo">
            LHX
        </div>

        <h1>LHX Keysystem</h1>

        <p class="subtitle">
            Complete the actions below to get the key! 🔑
        </p>

        <div class="tasks">

            <!-- TIKTOK -->

            <button
                id="tiktokButton"
                class="task-button tiktok-button"
                onclick="openTikTok()"
            >
                <svg
                    id="tiktokIcon"
                    class="tiktok-icon"
                    viewBox="0 0 448 512"
                    aria-hidden="true"
                >
                    <path d="M448 209.9v125.1c-44.3 0-87.3-14.4-122.6-40.9v104.4c0 89.1-72.2 161.5-161.5 161.5S2.4 487.6 2.4 398.5 74.6 237 163.9 237c7.3 0 14.5.5 21.5 1.5v126.5c-6.8-2.2-14-3.4-21.5-3.4-20.4 0-37 16.6-37 37s16.6 37 37 37 37-16.6 37-37V0h125.1c0 46.4 37.6 84 84 84v125.9c13.3 0 26.1 0 38-.1z"/>
                </svg>

                <span id="tiktokText">Follow user</span>
            </button>

            <!-- YOUTUBE -->

            <button
                id="youtubeButton"
                class="task-button youtube-button"
                onclick="openYouTube()"
            >
                <svg
                    id="youtubeIcon"
                    class="youtube-icon"
                    viewBox="0 0 576 512"
                    aria-hidden="true"
                >
                    <path d="M549.7 124.1c-6.3-23.7-24.8-42.2-48.6-48.6C458.8 64 288 64 288 64S117.2 64 74.9 75.5c-23.8 6.4-42.3 24.9-48.6 48.6C14.8 167 14.8 256 14.8 256s0 89 11.5 131.9c6.3 23.7 24.8 42.2 48.6 48.6C117.2 448 288 448 288 448s170.8 0 213.1-11.5c23.8-6.4 42.3-24.9 48.6-48.6C561.2 345 561.2 256 561.2 256s0-89-11.5-131.9zM232 337V175l142.7 81L232 337z"/>
                </svg>

                <span id="youtubeText">
                    Subscribe to channel
                </span>
            </button>

        </div>


        <!-- UNLOCK PROGRESS -->

        <div
            id="progressSection"
            class="progress-section"
        >

            <div class="progress-header">

                <div class="progress-title">
                    🔓 Unlock Progress
                </div>

                <div
                    id="progressPercent"
                    class="progress-percent"
                >
                    0%
                </div>

            </div>

            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

            <div
                id="progressStatus"
                class="progress-status"
            >
                Complete both actions to unlock your key
            </div>

        </div>


        <div class="footer">
            <span>LHX</span> • Key System
        </div>

    </main>


    <script>

        const tasks = {
            tiktok: {
                button: document.getElementById("tiktokButton"),
                icon: document.getElementById("tiktokIcon"),
                text: document.getElementById("tiktokText"),
                checking: false,
                completed: false,
                startTime: null
            },

            youtube: {
                button: document.getElementById("youtubeButton"),
                icon: document.getElementById("youtubeIcon"),
                text: document.getElementById("youtubeText"),
                checking: false,
                completed: false,
                startTime: null
            }
        };


        const progressFill =
            document.getElementById("progressFill");

        const progressPercent =
            document.getElementById("progressPercent");

        const progressStatus =
            document.getElementById("progressStatus");

        const progressSection =
            document.getElementById("progressSection");


        function startChecking(taskName, url) {

            const task = tasks[taskName];

            if (task.checking || task.completed) return;

            task.checking = true;
            task.startTime = Date.now();

            task.button.classList.add("checking");

            task.icon.style.display = "none";

            const spinner =
                document.createElement("div");

            spinner.className = "loading-spinner";

            if (taskName === "tiktok") {
                spinner.classList.add("tiktok-spinner");
            }

            spinner.id = taskName + "Spinner";

            task.button.insertBefore(
                spinner,
                task.text
            );

            task.text.textContent = "Checking...";

            window.open(url, "_blank");
        }


        function openTikTok() {

            startChecking(
                "tiktok",
                "https://www.tiktok.com/@brolhx?_r=1&_t=ZG-99S1oDqkQ6L"
            );
        }


        function openYouTube() {

            startChecking(
                "youtube",
                "https://youtube.com/@lhxyt?si=61fUtIj-w93PhUoB"
            );
        }


        window.addEventListener(
            "focus",
            function () {

                Object.keys(tasks).forEach(
                    function (taskName) {

                        const task =
                            tasks[taskName];

                        if (
                            !task.checking ||
                            !task.startTime
                        ) {
                            return;
                        }

                        const timePassed =
                            Date.now() -
                            task.startTime;

                        if (timePassed >= 7000) {
                            completeTask(taskName);
                        }

                    }
                );

            }
        );


        function completeTask(taskName) {

            const task = tasks[taskName];

            task.checking = false;
            task.completed = true;

            task.button.classList.remove(
                "checking"
            );

            task.button.classList.remove(
                "tiktok-button"
            );

            task.button.classList.remove(
                "youtube-button"
            );

            task.button.classList.add(
                "completed"
            );


            const spinner =
                document.getElementById(
                    taskName + "Spinner"
                );

            if (spinner) {
                spinner.remove();
            }


            task.text.textContent =
                "Completed";


            const check =
                document.createElement("span");

            check.className = "check-icon";
            check.textContent = "✓";


            task.button.insertBefore(
                check,
                task.text
            );


            task.button.onclick = null;


            updateProgress();
        }


        function updateProgress() {

            let completedCount = 0;

            Object.keys(tasks).forEach(
                function (taskName) {

                    if (
                        tasks[taskName].completed
                    ) {
                        completedCount++;
                    }

                }
            );


            const totalTasks = 2;

            const percentage =
                (completedCount / totalTasks) * 100;


            progressFill.style.width =
                percentage + "%";


            animatePercentage(
                percentage
            );


            if (percentage === 0) {

                progressStatus.textContent =
                    "Complete both actions to unlock your key";

            }

            else if (percentage === 50) {

                progressStatus.textContent =
                    "Almost there! Complete 1 more action";

            }

            else if (percentage === 100) {

                progressStatus.textContent =
                    "🎉 All actions completed! Key unlocked!";

                progressSection.classList.add(
                    "unlocked"
                );
            }

        }


        function animatePercentage(target) {

            const start =
                parseInt(
                    progressPercent.textContent
                ) || 0;

            const duration = 700;

            const startTime =
                performance.now();


            function update(currentTime) {

                const progress =
                    Math.min(
                        (currentTime - startTime) /
                        duration,
                        1
                    );


                const value =
                    Math.floor(
                        start +
                        (target - start) * progress
                    );


                progressPercent.textContent =
                    value + "%";


                if (progress < 1) {

                    requestAnimationFrame(
                        update
                    );
                }

            }


            requestAnimationFrame(update);
        }

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LHX Keysystem</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 20% 20%, #25253d 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #301722 0%, transparent 35%),
                #08080d;
            color: white;
        }
        .background-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.18;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }
        .glow-one {
            background: #ffffff;
            top: -250px;
            left: -200px;
        }
        .glow-two {
            background: #ff0000;
            bottom: -300px;
            right: -200px;
            animation-delay: 3s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(60px, 40px); }
        }
        .container {
            width: 90%;
            max-width: 520px;
            padding: 38px;
            position: relative;
            z-index: 2;
            background: rgba(18, 18, 25, 0.88);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardAppear 0.7s cubic-bezier(.2,.8,.2,1);
        }
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .hidden {
            display: none !important;
        }
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            border-radius: 24px;
            background: linear-gradient(135deg, #ffffff, #8f8f8f);
            color: black;
            font-size: 25px;
            font-weight: 900;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.15);
            animation: logoFloat 4s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-7px) rotate(2deg); }
        }
        h1 {
            text-align: center;
            font-size: 36px;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff, #8f8f8f, #ffffff);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 4s linear infinite;
        }
        @keyframes titleGlow {
            from { background-position: 0%; }
            to { background-position: 200%; }
        }
        .subtitle {
            text-align: center;
            color: #9a9a9a;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .tasks {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .task-button {
            width: 100%;
            min-height: 64px;
            padding: 17px 22px;
            position: relative;
            overflow: hidden;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            font-size: 16px;
            font-weight: 800;
            transition:
                transform 0.25s cubic-bezier(.2,.8,.2,1),
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }
        .task-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.45),
                transparent
            );
            transform: skewX(-25deg);
            transition: left 0.6s ease;
        }
        .task-button:hover::before { left: 150%; }
        .task-button:hover { transform: translateY(-5px) scale(1.02); }
        .task-button:active { transform: scale(0.97); }
        .tiktok-button {
            color: #000;
            background: linear-gradient(135deg, #ffffff, #e9e9e9, #ffffff);
            box-shadow:
                0 10px 0 #bdbdbd,
                0 18px 40px rgba(255,255,255,0.08);
        }
        .tiktok-icon {
            width: 25px;
            height: 25px;
            fill: #000;
        }
        .youtube-button {
            color: white;
            background: linear-gradient(135deg, #ff2828, #e00000 50%, #b90000);
            box-shadow:
                0 10px 0 #870000,
                0 18px 40px rgba(255,0,0,0.2);
        }
        .youtube-icon {
            width: 28px;
            height: 28px;
            fill: white;
        }
        .checking {
            pointer-events: none;
            cursor: wait;
            animation: checkingPulse 1.2s ease-in-out infinite;
        }
        @keyframes checkingPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); filter: brightness(1.15); }
        }
        .loading-spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .tiktok-spinner {
            border-color: rgba(0,0,0,0.2);
            border-top-color: black;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .retry-message {
            color: white !important;
            pointer-events: none;
            background: linear-gradient(
                135deg,
                #ff1b1b,
                #9b0000,
                #ff0000,
                #6b0000
            ) !important;
            background-size: 300% 300%;
            border: 2px solid rgba(255,70,70,0.9);
            box-shadow:
                0 0 20px rgba(255,0,0,0.9),
                0 0 60px rgba(255,0,0,0.6),
                0 0 120px rgba(255,0,0,0.3);
            animation:
                warningShake 0.45s ease-in-out infinite,
                warningPulse 0.8s ease-in-out infinite,
                warningGradient 2s linear infinite;
        }
        @keyframes warningShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        @keyframes warningPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.7); }
        }
        @keyframes warningGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .completed {
            color: white;
            background: linear-gradient(135deg, #20df7a, #0aa552) !important;
            box-shadow:
                0 10px 0 #08763d,
                0 18px 45px rgba(24,201,110,0.3);
            pointer-events: none;
            animation: completedPop 0.5s ease;
        }
        @keyframes completedPop {
            0% { transform: scale(0.9); }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .check-icon {
            font-size: 22px;
            font-weight: bold;
        }
        .progress-section {
            margin-top: 30px;
            padding: 22px;
            border-radius: 20px;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.07),
                rgba(255,255,255,0.025)
            );
            border: 1px solid rgba(255,255,255,0.1);
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .progress-title {
            font-size: 14px;
            font-weight: 800;
        }
        .progress-percent {
            font-size: 14px;
            font-weight: 900;
        }
        .progress-bar {
            width: 100%;
            height: 14px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(0,0,0,0.4);
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #777, white, #777);
            background-size: 200%;
            transition: width 1s cubic-bezier(.2,.8,.2,1);
            animation: progressShine 2s linear infinite;
        }
        @keyframes progressShine {
            from { background-position: 0%; }
            to { background-position: 200%; }
        }
        .progress-status {
            margin-top: 14px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }
        .issues {
            margin-top: 14px;
            text-align: center;
            font-size: 11px;
            color: #555;
            letter-spacing: 0.3px;
        }
        .issues span {
            color: #aaa;
            font-weight: bold;
        }
        .key-loading {
            text-align: center;
            padding: 45px 10px;
            animation: loadingAppear 0.5s ease;
        }
        @keyframes loadingAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .mega-spinner {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            border-radius: 50%;
            border: 7px solid rgba(255,255,255,0.08);
            border-top-color: white;
            border-right-color: #777;
            box-shadow:
                0 0 25px rgba(255,255,255,0.25),
                0 0 70px rgba(255,255,255,0.1);
            animation:
                megaSpin 0.8s linear infinite,
                megaPulse 1.2s ease-in-out infinite;
        }
        @keyframes megaSpin {
            to { transform: rotate(360deg); }
        }
        @keyframes megaPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.8); }
        }
        .creating-text {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: -0.5px;
            animation: creatingPulse 1s ease-in-out infinite;
        }
        @keyframes creatingPulse {
            0%, 100% { opacity: 0.55; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }
        .loading-dots::after {
            content: "";
            animation: dots 1.4s steps(4,end) infinite;
        }
        @keyframes dots {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75%, 100% { content: "..."; }
        }
        .key-result {
            text-align: center;
            animation: resultAppear 0.8s cubic-bezier(.2,.9,.2,1);
        }
        @keyframes resultAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.85); }
            70% { transform: translateY(-5px) scale(1.03); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .success-icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #20df7a, #0aa552);
            font-size: 40px;
            box-shadow:
                0 0 25px rgba(24,201,110,0.6),
                0 0 70px rgba(24,201,110,0.25);
            animation: successPop 0.7s cubic-bezier(.2,1.5,.4,1);
        }
        @keyframes successPop {
            from { transform: scale(0) rotate(-180deg); }
            to { transform: scale(1) rotate(0); }
        }
        .created-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #20df7a, #ffffff, #20df7a);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 2s linear infinite;
        }
        .key-label {
            margin-bottom: 14px;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffcc00, white, #ffcc00);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation:
                titleGlow 1.5s linear infinite,
                labelFloat 2s ease-in-out infinite;
        }
        @keyframes labelFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .key-box {
            width: 100%;
            padding: 20px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 900;
            word-break: break-all;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.13),
                rgba(255,255,255,0.04)
            );
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 15px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            animation: keyGlow 2s ease-in-out infinite;
        }
        .key-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 70%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.25),
                transparent
            );
            transform: skewX(-25deg);
            animation: keyShine 2.5s linear infinite;
        }
        @keyframes keyGlow {
            0%, 100% {
                box-shadow:
                    0 0 15px rgba(255,255,255,0.1),
                    0 15px 40px rgba(0,0,0,0.3);
            }
            50% {
                box-shadow:
                    0 0 30px rgba(255,255,255,0.3),
                    0 0 70px rgba(255,255,255,0.08);
            }
        }
        @keyframes keyShine {
            from { left: -100%; }
            to { left: 150%; }
        }
        .key-expiry {
            margin-top: 16px;
            color: #ff7777;
            font-size: 14px;
            font-weight: bold;
        }
        .copy-button {
            width: 100%;
            margin-top: 18px;
            padding: 17px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            color: black;
            font-size: 16px;
            font-weight: 900;
            background: linear-gradient(135deg, white, #c9c9c9);
            box-shadow:
                0 8px 0 #969696,
                0 15px 35px rgba(255,255,255,0.1);
            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }
        .copy-button:hover {
            transform: translateY(-4px);
            filter: brightness(1.1);
        }
        .copy-button:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #969696;
        }
        .copy-success {
            background: linear-gradient(135deg, #20df7a, #0aa552) !important;
            color: white !important;
            box-shadow:
                0 8px 0 #08763d,
                0 15px 40px rgba(24,201,110,0.3) !important;
            animation: copyPop 0.5s ease;
        }
        @keyframes copyPop {
            0% { transform: scale(0.95); }
            60% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* AidZap advertisement */
        .ad-container {
            margin-top: 30px;
            padding: 10px 0 0;
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 5;
        }
        .ad-container a,
        .ad-container img {
            display: block;
            width: 100%;
            max-width: 728px;
            height: auto;
            border: 0;
        }

        @media (max-width: 500px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="container">
        <div id="mainSystem">
            <div class="logo">LHX</div>
            <h1>LHX Keysystem</h1>
            <p class="subtitle">
                Complete the actions below to get the key! 🔑
            </p>

            <div class="tasks">
                <button
                    id="tiktokButton"
                    class="task-button tiktok-button"
                    onclick="openTikTok()"
                >
                    <svg
                        id="tiktokIcon"
                        class="tiktok-icon"
                        viewBox="0 0 448 512"
                    >
                        <path d="M448 209.9v125.1c-44.3 0-87.3-14.4-122.6-40.9v104.4c0 89.1-72.2 161.5-161.5 161.5S2.4 487.6 2.4 398.5 74.6 237 163.9 237c7.3 0 14.5.5 21.5 1.5v126.5c-6.8-2.2-14-3.4-21.5-3.4-20.4 0-37 16.6-37 37s16.6 37 37 37 37-16.6 37-37V0h125.1c0 46.4 37.6 84 84 84v125.9c13.3 0 26.1 0 38-.1z"/>
                    </svg>
                    <span id="tiktokText">Follow user</span>
                </button>

                <button
                    id="youtubeButton"
                    class="task-button youtube-button"
                    onclick="openYouTube()"
                >
                    <svg
                        id="youtubeIcon"
                        class="youtube-icon"
                        viewBox="0 0 576 512"
                    >
                        <path d="M549.7 124.1c-6.3-23.7-24.8-42.2-48.6-48.6C458.8 64 288 64 288 64S117.2 64 74.9 75.5c-23.8 6.4-42.3 24.9-48.6 48.6C14.8 167 14.8 256 14.8 256s0 89 11.5 131.9c6.3 23.7 24.8 42.2 48.6 48.6C117.2 448 288 448 288 448s170.8 0 213.1-11.5c23.8-6.4 42.3-24.9 48.6-48.6C561.2 345 561.2 256 561.2 256s0-89-11.5-131.9zM232 337V175l142.7 81L232 337z"/>
                    </svg>
                    <span id="youtubeText">Subscribe to channel</span>
                </button>
            </div>

            <div class="progress-section">
                <div class="progress-header">
                    <div class="progress-title">🔓 Unlock Progress</div>
                    <div id="progressPercent" class="progress-percent">0%</div>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="progressStatus" class="progress-status">
                    Complete both actions to unlock your key
                </div>
            </div>

            <div class="issues">
                Any issues? DM <span>lhx10</span> on DC
            </div>
        </div>

        <div id="keyLoading" class="key-loading hidden">
            <div class="mega-spinner"></div>
            <div class="creating-text">
                Creating your key<span class="loading-dots"></span>
            </div>
        </div>

        <div id="keyResult" class="key-result hidden">
            <div class="success-icon">✓</div>
            <div class="created-title">We created your key! ✅</div>
            <div class="key-label">This is your key!!</div>
            <div id="keyBox" class="key-box">
                lhxlikesscripting291
            </div>
            <div id="keyExpiry" class="key-expiry">
                Key expires in 06:00:00
            </div>
            <button
                id="copyButton"
                class="copy-button"
                onclick="copyKey()"
            >
                📋 Copy Key
            </button>
            <div class="issues">
                Any issues? DM <span>lhx10</span> on DC
            </div>
        </div>

        <!-- AidZap Advertisement -->
        <div class="ad-container">
            <a href="https://aidzap.com/r/5DA7BEEB" target="_blank" rel="noopener noreferrer">
                <img
                    src="https://aidzap.com/banner-img/publisher/en/aidzap-publisher-en-728x90"
                    alt="Advertisement"
                >
            </a>
        </div>
    </main>

    <script>
        const tasks = {
            tiktok: {
                button: document.getElementById("tiktokButton"),
                icon: document.getElementById("tiktokIcon"),
                text: document.getElementById("tiktokText"),
                checking: false,
                completed: false,
                startTime: null,
                originalText: "Follow user",
                warningText: "⚠️ Did you really followed?"
            },
            youtube: {
                button: document.getElementById("youtubeButton"),
                icon: document.getElementById("youtubeIcon"),
                text: document.getElementById("youtubeText"),
                checking: false,
                completed: false,
                startTime: null,
                originalText: "Subscribe to channel",
                warningText: "⚠️ Did you really subscribe?"
            }
        };

        const progressFill = document.getElementById("progressFill");
        const progressPercent = document.getElementById("progressPercent");
        const progressStatus = document.getElementById("progressStatus");

        function startChecking(taskName, url) {
            const task = tasks[taskName];

            if (task.checking || task.completed) {
                return;
            }

            task.checking = true;
            task.startTime = Date.now();
            task.button.classList.add("checking");
            task.icon.style.display = "none";

            const spinner = document.createElement("div");
            spinner.className = "loading-spinner";

            if (taskName === "tiktok") {
                spinner.classList.add("tiktok-spinner");
            }

            spinner.id = taskName + "Spinner";
            task.button.insertBefore(spinner, task.text);
            task.text.textContent = "Checking...";

            window.open(url, "_blank");
        }

        function openTikTok() {
            startChecking(
                "tiktok",
                "https://www.tiktok.com/@brolhx?_r=1&_t=ZG-99S1oDqkQ6L"
            );
        }

        function openYouTube() {
            startChecking(
                "youtube",
                "https://youtube.com/@lhxyt?si=61fUtIj-w93PhUoB"
            );
        }

        window.addEventListener("focus", function () {
            Object.keys(tasks).forEach(function (taskName) {
                const task = tasks[taskName];

                if (!task.checking || !task.startTime) {
                    return;
                }

                const timePassed = Date.now() - task.startTime;

                // Geändert: 4 Sekunden statt 7 Sekunden.
                if (timePassed < 4000) {
                    showRetryMessage(taskName);
                } else {
                    completeTask(taskName);
                }
            });
        });

        function showRetryMessage(taskName) {
            const task = tasks[taskName];

            task.checking = false;
            task.startTime = null;
            task.button.classList.remove("checking");
            task.button.classList.add("retry-message");

            const spinner = document.getElementById(taskName + "Spinner");

            if (spinner) {
                spinner.remove();
            }

            task.icon.style.display = "none";
            task.text.textContent = task.warningText;

            setTimeout(function () {
                resetTask(taskName);
            }, 2000);
        }

        function resetTask(taskName) {
            const task = tasks[taskName];

            task.button.classList.remove("retry-message");
            task.icon.style.display = "block";
            task.text.textContent = task.originalText;
            task.checking = false;
            task.startTime = null;
        }

        function completeTask(taskName) {
            const task = tasks[taskName];

            task.checking = false;
            task.completed = true;
            task.startTime = null;
            task.button.classList.remove("checking");
            task.button.classList.remove("tiktok-button");
            task.button.classList.remove("youtube-button");
            task.button.classList.add("completed");

            const spinner = document.getElementById(taskName + "Spinner");

            if (spinner) {
                spinner.remove();
            }

            task.icon.style.display = "none";
            task.text.textContent = "Completed";

            const check = document.createElement("span");
            check.className = "check-icon";
            check.textContent = "✓";
            task.button.insertBefore(check, task.text);

            updateProgress();
        }

        function updateProgress() {
            let completedCount = 0;

            Object.keys(tasks).forEach(function (taskName) {
                if (tasks[taskName].completed) {
                    completedCount++;
                }
            });

            const percentage = (completedCount / 2) * 100;

            progressFill.style.width = percentage + "%";
            progressPercent.textContent = percentage + "%";

            if (percentage === 50) {
                progressStatus.textContent =
                    "Almost there! Complete 1 more action";
            }

            if (percentage === 100) {
                progressStatus.textContent =
                    "🎉 All actions completed! Creating key...";
                setTimeout(createKey, 900);
            }
        }

        function createKey() {
            document.getElementById("mainSystem").classList.add("hidden");
            document.getElementById("keyLoading").classList.remove("hidden");

            // 3-second key creation.
            setTimeout(function () {
                const key =
                    "LHX-" +
                    Array.from(
                        crypto.getRandomValues(new Uint8Array(24)),
                        b => b.toString(16).padStart(2, "0")
                    ).join("");

                document.getElementById("keyBox").textContent = key;
                document.getElementById("keyLoading").classList.add("hidden");
                document.getElementById("keyResult").classList.remove("hidden");

                // Key countdown: 6 hours.
                let secondsLeft = 6 * 60 * 60;
                const expiry = document.getElementById("keyExpiry");
                const copyButton = document.getElementById("copyButton");

                function updateExpiry() {
                    const hours = Math.floor(secondsLeft / 3600);
                    const minutes = Math.floor((secondsLeft % 3600) / 60);
                    const seconds = secondsLeft % 60;

                    expiry.textContent =
                        "Key expires in " +
                        String(hours).padStart(2, "0") + ":" +
                        String(minutes).padStart(2, "0") + ":" +
                        String(seconds).padStart(2, "0");
                }

                updateExpiry();

                const countdown = setInterval(function () {
                    secondsLeft--;

                    if (secondsLeft <= 0) {
                        clearInterval(countdown);
                        document.getElementById("keyBox").textContent = "EXPIRED";
                        expiry.textContent = "Key expired!";
                        copyButton.disabled = true;
                        copyButton.textContent = "Key Expired";
                        copyButton.style.opacity = "0.5";
                        copyButton.style.cursor = "not-allowed";
                        return;
                    }

                    updateExpiry();
                }, 1000);
            }, 3000);
        }

        function copyKey() {
            const key = document.getElementById("keyBox").textContent;

            if (key === "EXPIRED") {
                return;
            }

            navigator.clipboard.writeText(key).then(function () {
                const button = document.getElementById("copyButton");
                button.textContent = "✓ Key Copied!";
                button.classList.add("copy-success");

                setTimeout(function () {
                    button.textContent = "📋 Copy Key";
                    button.classList.remove("copy-success");
                }, 2000);
            }).catch(function () {
                alert("Could not copy automatically.");
            });
        }
    </script>
</body>
</html>
